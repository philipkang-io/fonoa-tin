name: API Tests (Postman CLI)

on:
  workflow_dispatch: 
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      # --report-events reports run results to Postman Cloud, which populates
      # the API Catalog "CI Pipeline Runs" + "CI/CD Activity" tabs.
      # Baseline is the spec reference + mock source (no assertions) — not a CI gate.
      - name: Run [Smoke]
        run: postman collection run "52509354-52bbc1a7-74c7-4c9b-86d9-095e00e96c20" -e "52509354-4697357f-4e35-4d1c-9843-11e1c3ed90e2" --report-events

      - name: Run [Contract]
        run: postman collection run "52509354-845bb305-c178-40dc-9cac-17afa9800908" -e "52509354-4697357f-4e35-4d1c-9843-11e1c3ed90e2" --report-events
